[project]
name = "gemini-for-agents"
version = "1.1.0"
description = "Google Gemini as OpenAI-compatible API proxy for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
streaming = ["httpx>=0.25"]

[project.scripts]
gemini-for-agents = "gemini_web2api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
